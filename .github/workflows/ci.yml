# Checks a clean checkout: everything here runs without GUI Designer, donors or samples.
# GUI Designer integration (--integration / --golden) stays a local, manual step.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  plugin:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: src/figma-plugin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/figma-plugin/package-lock.json
      - run: npm ci
      - run: npm run verify

  cli:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet build ExtronExporter.slnx --configuration Release
      - run: dotnet run --no-build --configuration Release --project tests/format
      - run: dotnet run --no-build --configuration Release --project src/cli -- validate-package tests/fixtures/exui-v5/project-1025m.exui
